syntax = "proto3";

package pricing;

option go_package = "syncride/backend/shared/proto/pricing";

service PricingService {
  rpc GetEstimate (GetEstimateRequest) returns (EstimateResponse);
  rpc CalculateFinalFare (CalculateFinalFareRequest) returns (FareResponse);
}

message GetEstimateRequest {
  double pickup_lat = 1;
  double pickup_lng = 2;
  double dropoff_lat = 3;
  double dropoff_lng = 4;
  string ride_type = 5; 
}

message CalculateFinalFareRequest {
  string trip_id = 1;
  string ride_type = 2;
  double distance_meters = 3;
  int64 duration_seconds = 4;
}

message EstimateResponse {
  double min_fare = 1;
  double max_fare = 2;
  double surge_multiplier = 3;
  string currency = 4;
}

message FareResponse {
  string receipt_id = 1;
  double final_amount = 2;
  string currency = 3;
}