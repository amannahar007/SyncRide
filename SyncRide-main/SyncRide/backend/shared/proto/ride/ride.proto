syntax = "proto3";

package ride;

option go_package = "github.com/syncride/backend/shared/proto/ride";

service RideService {
  rpc RequestRide (RequestRideRequest) returns (RideResponse);
  rpc UpdateRideStatus (UpdateRideStatusRequest) returns (RideResponse);
  rpc GetRide (GetRideRequest) returns (RideResponse);
}

enum RideStatus {
  REQUESTED = 0;
  ACCEPTED = 1;
  IN_PROGRESS = 2;
  COMPLETED = 3;
  CANCELLED = 4;
}

message RequestRideRequest {
  string passenger_id = 1;
  double pickup_lat = 2;
  double pickup_lng = 3;
  double dropoff_lat = 4;
  double dropoff_lng = 5;
  string ride_type = 6;
}

message UpdateRideStatusRequest {
  string ride_id = 1;
  string driver_id = 2;
  RideStatus status = 3;
}

message GetRideRequest {
  string ride_id = 1;
}

message RideResponse {
  string id = 1;
  string passenger_id = 2;
  string driver_id = 3;
  RideStatus status = 4;
  string created_at = 5;
}

