syntax = "proto3";

package driver;

option go_package = "syncride/backend/shared/proto/driver";

service DriverService {
  rpc UpdateDriverStatus (UpdateDriverStatusRequest) returns (DriverResponse);
  rpc UpdateLocation (UpdateLocationRequest) returns (LocationResponse);
}

enum DriverStatus {
  OFFLINE = 0;
  ONLINE = 1;
  ON_TRIP = 2;
}

message UpdateDriverStatusRequest {
  string driver_id = 1;
  DriverStatus status = 2;
}

message UpdateLocationRequest {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message DriverResponse {
  string id = 1;
  string user_id = 2;
  DriverStatus status = 3;
}

message LocationResponse {
  bool success = 1;
}