syntax = "proto3";

package trip;

option go_package = "syncride/backend/shared/proto/trip";

service TripService {
  rpc StartTrip (StartTripRequest) returns (TripResponse);
  rpc CompleteTrip (CompleteTripRequest) returns (TripResponse);
  rpc UpdateTripTelemetry (UpdateTripTelemetryRequest) returns (TelemetryResponse);
}

message StartTripRequest {
  string ride_id = 1;
  string driver_id = 2;
}

message CompleteTripRequest {
  string trip_id = 1;
  double final_lat = 2;
  double final_lng = 3;
}

message UpdateTripTelemetryRequest {
  string trip_id = 1;
  double current_lat = 2;
  double current_lng = 3;
}

message TripResponse {
  string id = 1;
  string ride_id = 2;
  string start_time = 3;
  string end_time = 4; // Empty if trip is active
}

message TelemetryResponse {
  bool success = 1;
}