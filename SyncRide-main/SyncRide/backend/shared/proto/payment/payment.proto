syntax = "proto3";

package payment;

option go_package = "syncride/backend/shared/proto/payment";

service PaymentService {
  rpc GetWalletBalance (GetWalletRequest) returns (WalletResponse);
  rpc TopUpWallet (TopUpWalletRequest) returns (WalletResponse);
  rpc ProcessPayment (ProcessPaymentRequest) returns (PaymentResponse);
}

message GetWalletRequest {
  string user_id = 1;
}

message TopUpWalletRequest {
  string user_id = 1;
  double amount = 2;
  string currency = 3;
}

message ProcessPaymentRequest {
  string user_id = 1;
  string trip_id = 2;
  double amount = 3;
  string currency = 4;
}

message WalletResponse {
  string user_id = 1;
  double balance = 2;
  string currency = 3;
}

message PaymentResponse {
  bool success = 1;
  string transaction_id = 2;
  string message = 3;
}